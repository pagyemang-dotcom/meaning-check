[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meaningcheck"
version = "2.1.0"
description = "Make sure every reader understands a message the way you meant it."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
deploy = ["modal>=1.0"]

[project.scripts]
meaningcheck = "meaningcheck.cli:main"

[tool.setuptools]
packages = ["meaningcheck"]

[tool.setuptools.package-data]
meaningcheck = ["web/*.html", "web/data/*.json", "web/*.svg"]
