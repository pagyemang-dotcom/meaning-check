<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Message flows to two reader panels, an exact solver, the writer, and back to both panels">
        <rect width="900" height="300" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#888"/></marker></defs>
        <g fill="none" stroke="#888" stroke-width="1.4">
          <rect x="10" y="115" width="140" height="70" rx="10"/><rect x="200" y="30" width="170" height="80" rx="10" stroke="#3346d3"/><rect x="200" y="190" width="170" height="80" rx="10" stroke="#7a3fc2"/>
          <rect x="420" y="115" width="150" height="70" rx="10"/><rect x="620" y="115" width="130" height="70" rx="10"/><rect x="790" y="115" width="100" height="70" rx="10" stroke="#1d7f47"/>
          <path d="M150 140 L198 75" marker-end="url(#ar)"/><path d="M150 160 L198 225" marker-end="url(#ar)"/>
          <path d="M370 70 L418 135" marker-end="url(#ar)"/><path d="M370 230 L418 165" marker-end="url(#ar)"/>
          <path d="M570 150 L618 150" marker-end="url(#ar)"/><path d="M750 150 L788 150" marker-end="url(#ar)"/>
          <path d="M685 115 C685 40 470 20 372 50" stroke-dasharray="4 4" marker-end="url(#ar)"/><path d="M685 185 C685 260 470 285 372 250" stroke-dasharray="4 4" marker-end="url(#ar)"/>
        </g>
        <g font-size="13" fill="#1b1a18" text-anchor="middle" font-family="system-ui,sans-serif">
          <text x="80" y="145" font-weight="600">Your message</text><text x="80" y="163" fill="#68645c" font-size="11.5">+ what you mean</text>
          <text x="285" y="62" font-weight="600" fill="#3346d3">Muse Glimmer</text><text x="285" y="80" font-size="11.5" fill="#68645c">16 readers, open weights</text><text x="285" y="96" font-size="11.5" fill="#68645c">token probabilities</text>
          <text x="285" y="222" font-weight="600" fill="#7a3fc2">Muse Spark</text><text x="285" y="240" font-size="11.5" fill="#68645c">8 readers, Meta API</text><text x="285" y="256" font-size="11.5" fill="#68645c">second opinion</text>
          <text x="495" y="145" font-weight="600">Exact cover</text><text x="495" y="163" font-size="11.5" fill="#68645c">fewest facts (HiGHS)</text>
          <text x="685" y="145" font-weight="600">Writer</text><text x="685" y="163" font-size="11.5" fill="#68645c">4 candidate wordings</text>
          <text x="840" y="145" font-weight="600" fill="#1d7f47">Send</text><text x="840" y="163" font-size="11.5" fill="#68645c">shortest that</text><text x="840" y="179" font-size="11.5" fill="#68645c">both models read</text>
          <text x="560" y="24" font-size="11.5" fill="#68645c">every candidate re-read by both models</text>
        </g>
      </svg>